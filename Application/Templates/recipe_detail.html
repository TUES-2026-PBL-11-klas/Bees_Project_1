{% extends "base.html" %}

{% block content %}
<div style="max-width: 800px; margin: 40px auto; padding: 20px; color: white; font-family: sans-serif; background: #1a2634; border-radius: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>{{ recipe.title }}</h1>
        <form action="/favorite/{{ recipe.id }}" method="POST">
            <button type="submit" style="background: none; border: none; cursor: pointer; font-size: 30px; color: #ff4757;">
                ❤
            </button>
        </form>
    </div>
    
    <p style="color: #ccc; font-style: italic;">{{ recipe.description }}</p>
    
    <hr style="border: 0; border-top: 1px solid #444; margin: 20px 0;">
    
    <h3>Ingredients</h3>
    <ul>
        {% for ri in recipe.ingredients %}
        <li>{{ ri.ingredient.name }}</li>
        {% endfor %}
    </ul>
    
    <h3>Instructions</h3>
    <p style="line-height: 1.6;">{{ recipe.instructions }}</p>
    
    <a href="/home" style="display: inline-block; margin-top: 20px; color: #2b6df2; text-decoration: none;">← Back to Home</a>
</div>
{% endblock %}
