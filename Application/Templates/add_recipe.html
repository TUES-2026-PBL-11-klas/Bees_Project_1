{% extends "base.html" %}

{% block content %}

<div class="bg-white/40 dark:bg-gray-800 p-8 rounded-xl shadow-lg max-w-xl mx-auto">

    <h2 class="text-gray-900 dark:text-white text-2xl font-bold mb-6">Add New Recipe</h2>

    <form class="space-y-4">
        <input type="text" placeholder="Recipe name"
               class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-300">

        <textarea placeholder="Description"
                  class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-300"></textarea>

        <input type="text" placeholder="Ingredients (comma separated)"
               class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-300">

        <button class="bg-green-700 dark:bg-green-600 text-gray-200 dark:text-white px-6 py-3 rounded-lg hover:bg-green-600 dark:hover:bg-green-500">
            Save Recipe
        </button>
    </form>

</div>

{% endblock %}
