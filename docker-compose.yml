services:
  backend:
    build: .
    container_name: clevercookin_backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/app
    restart: always
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn Application.main:app --host 0.0.0.0 --port 8000
      "

  db:
    image: postgres:15
    container_name: clevercookin_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clevercookin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clevercookin"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: